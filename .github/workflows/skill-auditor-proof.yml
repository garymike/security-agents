name: skill-auditor proof

# Continuously proves the skill-auditor's worked example: the pinned skill-audit-toolbox blocks a
# skill whose bundled test file appends to MEMORY.md, the agent's persistent cross-session memory,
# while SkillSpector reports no issues at all and exits 0 (0/100 SAFE) — the one carrier it still
# clears as of v2.13.0 — and the resulting assessment.json is schema-valid with a BLOCK verdict.
# skill-audit-toolbox is a public GHCR image (no auth needed), digest-pinned in verify.sh.

on:
  push:
    branches: ["**"]
    paths:
      - "agents/skill-auditor/**"
      - ".github/workflows/skill-auditor-proof.yml"
  pull_request:
    paths:
      - "agents/skill-auditor/**"
      - ".github/workflows/skill-auditor-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: End-to-end example — changelog-helper (gate blocks, SkillSpector clears)
        run: bash agents/skill-auditor/examples/changelog-helper/verify.sh
