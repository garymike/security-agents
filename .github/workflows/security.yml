name: Security

# Dogfoods the Tier-1 platform (garymike/security-workflows v1.6.0) on this repo.
# Pinned to the commit v1.6.0 resolves to, so a moved tag cannot change what runs here.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@e03d3bc00822ead5b2d19b9d41f6e79bd4862255 # main @ 2026-10-30

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@e03d3bc00822ead5b2d19b9d41f6e79bd4862255 # main @ 2026-10-30

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@e03d3bc00822ead5b2d19b9d41f6e79bd4862255 # main @ 2026-10-30

  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@e03d3bc00822ead5b2d19b9d41f6e79bd4862255 # main @ 2026-10-30

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@e03d3bc00822ead5b2d19b9d41f6e79bd4862255 # main @ 2026-10-30
