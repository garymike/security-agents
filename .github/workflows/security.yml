name: Security

# Dogfoods the Tier-1 platform (garymike/security-workflows) on this repo.
# Pinned by commit SHA, so a moved tag cannot change what runs here. The pin tracks
# main and Dependabot moves it, so it is not any particular release: this comment named
# v1.6.0, which the SHA stopped matching the first time the pin was bumped.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# No comment beside the SHAs below, not even `# main`. Dependabot maintains a trailing
# comment only when it can resolve the ref to a version, and a branch ref has none, so
# whatever is written there rots on the next bump. zizmor's ref-version-mismatch reads
# `# main` as a claim that the pin equals main's head, which a pin to a moving branch
# only matches in the window after a pin move; five callers were reporting that warning
# on 2026-11-17. A bare SHA is quiet for both, because zizmor flags a missing comment
# only under its pedantic persona. The SHA is the record; resolve it for branch or date.

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c

  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c
