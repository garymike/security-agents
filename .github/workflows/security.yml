name: Security

# Dogfoods the Tier-1 platform (garymike/security-workflows) on this repo.
# Pinned by commit SHA, so a moved tag cannot change what runs here. The pin tracks
# main and Dependabot moves it, so it is not any particular release: this comment named
# v1.6.0, which the SHA stopped matching the first time the pin was bumped.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# No date beside the SHAs below. Dependabot rewrites a trailing version comment only
# when the ref is a tag, so a date written next to a main-tracking SHA is never updated
# and goes stale on the next bump. The SHA is the record; resolve it to date a pin.

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c # main

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c # main

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c # main

  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c # main

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@2d15ded362058a997f4d1cfe843a6faedb74f80c # main
