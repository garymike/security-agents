name: Security

# Dogfoods the Tier-1 platform (garymike/security-workflows v1.6.0) on this repo.
# Pinned to the commit v1.6.0 resolves to, so a moved tag cannot change what runs here.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@ee54f130fd20edc27f600cbf9bab069a0e995ca5 # main @ 2026-09-09

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@ee54f130fd20edc27f600cbf9bab069a0e995ca5 # main @ 2026-09-09

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@ee54f130fd20edc27f600cbf9bab069a0e995ca5 # main @ 2026-09-09

  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@ee54f130fd20edc27f600cbf9bab069a0e995ca5 # main @ 2026-09-09

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@ee54f130fd20edc27f600cbf9bab069a0e995ca5 # main @ 2026-09-09
